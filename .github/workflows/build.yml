name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add repo secrets SIGNING_KEYSTORE_BASE64 + SIGNING_PASSWORD so every build
      # has the same signature (lets you `adb install -r` updates without uninstalling).
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/launcher.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/launcher.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MiniLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiniLauncher
          path: MiniLauncher.apk

      # Publishes a direct download link (easy to type into the "Downloader" app on the TV).
      - name: Publish "latest" release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Mini Launcher (${{ github.ref_name }})
          prerelease: true
          files: MiniLauncher.apk
